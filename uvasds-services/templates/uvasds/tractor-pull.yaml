# Helm template for the uvasds-services chart (ArgoCD).
# Copy to ~/Development/uvasds-services/uvasds-services/templates/uvasds/tractor-pull.yaml
# Image tag comes from values.yaml:  version.tractorPull: '0.2'
#
# Roll out a new version:
#   1. docker buildx build --platform linux/amd64 -t ghcr.io/nmagee/tractor-pull:X.Y --push .
#   2. set version.tractorPull: 'X.Y' in uvasds-services/values.yaml, commit, push
#   ArgoCD syncs within minutes.
#
# Requires secret tractor-pull-mongodb (k8s/mongodb-sealedsecret.yaml or k8s/mongodb-secret.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tractor-pull-deployment
  namespace: uvasds-services
  labels:
    app: tractor-pull
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tractor-pull
  template:
    metadata:
      labels:
        app: tractor-pull
    spec:
      imagePullSecrets:
      - name: nmagee-ghcr.io-auth
      containers:
      - name: tractor-pull-container
        image: ghcr.io/nmagee/tractor-pull:{{ .Values.version.tractorPull }}
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: tractor-pull-mongodb    # MONGODB_CONNSTRING
        env:
        - name: MONGODB_DB
          value: "dp3"
        - name: PRODUCTION_CLOSE
          value: "2026-12-09T23:59:00-05:00"
        ports:
        - containerPort: 8888
        resources:
          requests:
            memory: "4Gi"
            cpu: "4"
          limits:
            memory: "8Gi"
            cpu: "4"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.org/websocket-services: "tractor-pull-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/enable-websockets: "true"
    nginx.ingress.kubernetes.io/connection-proxy-header: "keep-alive"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  name: tractor-pull-ingress
  namespace: uvasds-services
spec:
  rules:
  - host: 8zbjmo41-data.pods.uvarc.io
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: tractor-pull-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tractor-pull-service
  namespace: uvasds-services
spec:
  selector:
    app: tractor-pull
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8888
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tractor-pull-mongodb
  namespace: uvasds-services
spec:
  encryptedData:
    MONGODB_CONNSTRING: 
  template:
    metadata:
      name: tractor-pull-mongodb
      namespace: uvasds-services
    type: Opaque

